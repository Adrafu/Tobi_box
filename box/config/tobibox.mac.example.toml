# Beispiel-Konfiguration für den Mac-Prototyp (Kopie: box/config/tobibox.toml).
# Relative Pfade gelten ab dem Ordner dieser Datei (box/config/).
# Die Kopie tobibox.toml steht in .gitignore und wird nie committet.

[pfade]
zustand = "../var"                 # Laufzeitdaten (resume.json, config.json, Protokoll), in box/var
medien = "../medien-sprache"       # Serienordner; gesprochene Testserien (Stimme "Thorsten", CC0)
# Zurück zu den Beispielserien mit Piepsern: medien = "../medien-beispiel"
# (dann auch music_directory in mpd.conf umstellen)

[leser]
# Der SuperMini am Mac heißt meist /dev/cu.usbmodemXXXX. Das Muster fängt das ab.
# Mit dem Fake-Leser (box/tools/fake_reader.py) hier stattdessen den Symlink eintragen,
# z. B. "/tmp/tobibox-fake/ttyACM0" (siehe docs/betrieb/mac-prototyp.md).
geraet = "/dev/cu.usbmodem*"
# Ohne Leser (nur mit "tobibox sim"): geraet = "sim". Die Status-Karte zeigt den Leser dann als "simulation".

[toene]
# Gesprochene Töne ("Tobi Box ist bereit." usw.). Zurück zu den Piepsern: die Zeile löschen
# oder auf "../sounds" setzen. Relative Pfade gelten ab dem Ordner dieser Datei.
ordner = "../sounds/sprache"
# Töne folgen der Lautstärke des Hörspiels (Entscheidung J). Dafür rechnet die Box mit derselben
# Kurve wie MPD. Am Mac (MPD-Software-Mixer) ist das die Vorgabe und braucht keine Zeile.
# Auf dem Pi (ALSA-softvol): kennlinie = "alsa_softvol" und softvol_bereich_db = max_dB - min_dB.
# kennlinie = "mpd_software"
# Abspielprogramm für Töne am Mac (empfohlen, braucht "brew install sox"):
# 1. Grund: afplay braucht je Ton rund 1 s Leerlauf, play (sox) nur etwa 0,15 s.
# 2. "pad 0 0.15" hängt 0,15 s Stille an. Ohne sie schneidet play das Ende ab (das letzte "f" fehlt).
# 3. Zurück zu afplay: die Zeile kommando unten löschen.
kommando = ["play", "-q", "{datei}", "pad", "0", "0.15"]

[mpd]
host = "localhost"
port = 6600                        # Muss zu "port" in mpd.mac.example.conf passen

[lautstaerke]
# Am Mac klemmt nur der Dienst (MPD kennt keine Maximal- und Startlautstärke).
# Achtung: MPD setzt die Prozent nicht linear um. 20 sind rund -33 dB, 40 rund -23 dB
# gegenüber der Datei (docs/betrieb/mac-prototyp.md). Zu leise? start/max erhöhen.
# Start darf nicht über max liegen (sonst Fehler beim Laden).
max = 40
start = 20
kopfhoerer = 30

[protokoll]
ziel = "datei"                     # am Mac: Protokoll in eine Datei (nicht stdout)
datei = "../var/log/tobibox.log"
ebene = "INFO"
max_bytes = 1000000
anzahl = 5

# [sync]
# Medien-Sync vom QNAP (rsync-Daemon, Modul "medien", nur lesend, über Tailscale).
# Ohne diesen Abschnitt läuft der Dienst wie bisher ohne Sync. Zum Einschalten die Zeilen einkommentieren. Nur Platzhalter, nie echte Zugangsdaten.
# host = "qnap.example.ts.net"        # Tailscale-Name oder -Adresse des QNAP
# port = 873
# modul = "medien"
# benutzer = "box1"
# Das Passwort steht nie in dieser Datei: entweder eine Datei (Rechte 600, nicht im Repo) ...
# passwort_datei = "../var/sync.pw"
# ... oder der Name einer Umgebungsvariable:
# passwort_umgebung = "TOBIBOX_SYNC_PASSWORT"
# Halbe Dateien landen hier, nie im Medienordner; gleiches Dateisystem wie "medien" (Vorgabe: neben "medien").
# partial_dir = "../.rsync-partial"
# intervall_s = 3600                  # Takt für den zeitgesteuerten Sync
# reserve_mb = 200                    # so viel Platz bleibt nach dem Sync mindestens frei

# [mqtt]
# Home Assistant über MQTT (Broker = Mosquitto-Add-on, erreichbar über Tailscale).
# Ohne diesen Abschnitt läuft der Dienst wie bisher ohne Home Assistant. Zum Einschalten die Zeilen einkommentieren.
# Das Passwort steht NUR in der lokalen tobibox.toml (gitignored), nie hier und nie im Repo.
# box_id = "box1"                     # Box-Name und zugleich MQTT-Konto: [a-z0-9][a-z0-9_-]{1,23}
# host = "broker.example.ts.net"      # Tailscale-Name oder -Adresse des Brokers
# port = 1883
# passwort = "<Passwort der Box>"     # nur in der lokalen Datei
# anzeigename = "Küche"               # Name in Home Assistant ("Tobi Box Küche"); Vorgabe: box_id

# [netz]
# Netz-Klasse home / hotspot / offline. Die WLAN-Namen gehören nur in die lokale Datei, nie ins Repo.
# Am Mac: quelle = "sim" (Vorgabe), das Netz wird mit "tobibox sim" vorgegeben, die Systemuhr gilt.
# Auf dem Pi: quelle = "networkmanager" (Zeitquelle dann NTP und die RTC des PiSugar).
# quelle = "sim"
# heim_ssid = "<Name des Heim-WLAN>"
# hotspot_ssid = "<Name des Handy-Hotspots>"
# nas_host = "qnap.example.ts.net"    # home gilt nur, wenn der NAS (rsync-Port) erreichbar ist; ohne Eintrag genügt die SSID
# nas_port = 873
# intervall_s = 10

# [strom]
# Akku, Lader, Taste und RTC. Am Mac: quelle = "sim" (Vorgabe), die Werte kommen von "tobibox sim power".
# Auf dem Pi: quelle = "pisugar" (pisugar-server auf 127.0.0.1:8423).
# quelle = "sim"
# tiefstand_prozent = 5               # darunter, nicht am Lader: Sync abbrechen und herunterfahren
# intervall_s = 10
# abschalt_kommando = ["systemctl", "poweroff"]   # Pi; am Mac wird nur protokolliert
