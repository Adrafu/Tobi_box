# MPD für den Mac-Prototyp (Homebrew). Start: siehe docs/betrieb/mac-prototyp.md.
#
# Alle Pfade mit DEIN_NAME durch deinen Benutzernamen ersetzen
# (Terminal: echo $HOME zeigt den Ordner). Absolute Pfade, kein "~".
# Der Ordner tobibox-mpd/ muss vorher existieren.
#
# Lautstärke: MPD läuft mit Software-Mixer. Am Mac gibt es KEINE harte
# Obergrenze wie am Pi (dort kappt ALSA). Die Grenze setzt allein der
# Box-Dienst (max/start in tobibox.toml, Klemmung im Dienst).

music_directory    "/Users/DEIN_NAME/Tobi_box/box/medien-beispiel"
playlist_directory "/Users/DEIN_NAME/tobibox-mpd/playlists"
db_file            "/Users/DEIN_NAME/tobibox-mpd/database"
state_file         "/Users/DEIN_NAME/tobibox-mpd/state"
sticker_file       "/Users/DEIN_NAME/tobibox-mpd/sticker.sql"
log_file           "/Users/DEIN_NAME/tobibox-mpd/mpd.log"

bind_to_address    "localhost"
port               "6600"

# Kleine Puffer: kurze Reaktionszeit beim Starten und Stoppen (Messung in AP 1.6).
audio_buffer_size  "512"
buffer_before_play "10%"

# Ausgabe am Mac: CoreAudio (Standard-Ausgabegerät des Macs).
audio_output {
    type       "osx"
    name       "CoreAudio"
    mixer_type "software"
}

# ReplayGain: gleiche Lautheit über gemischte Quellen (Modus track).
replaygain           "track"
replaygain_preamp    "0"
replaygain_missing_preamp "-6"
replaygain_limit     "yes"
