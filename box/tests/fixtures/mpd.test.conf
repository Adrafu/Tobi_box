# MPD-Konfiguration nur für Tests (tests/integration/conftest.py).
# Platzhalter @...@ ersetzt conftest.py: eigener Port, eigenes Verzeichnis.
# Null-Ausgabe (läuft in Echtzeit, gibt nichts aus), Software-Mixer.
music_directory     "@VERZ@/medien"
playlist_directory  "@VERZ@/playlists"
db_file             "@VERZ@/mpd.db"
log_file            "@VERZ@/mpd.log"
pid_file            "@VERZ@/mpd.pid"
state_file          "@VERZ@/state"
sticker_file        "@VERZ@/sticker.sql"
bind_to_address     "127.0.0.1"
port                "@PORT@"
auto_update         "no"
restore_paused      "no"

audio_output {
    type        "null"
    name        "Test-Null"
    mixer_type  "software"
}
