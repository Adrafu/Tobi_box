name: CI

on:
  push:
  pull_request:

jobs:
  box:
    name: Box-Dienst (pytest)
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: MPD, Mosquitto, ffmpeg und rsync installieren, Systemdienste aus
        run: |
          sudo apt-get update
          sudo apt-get install -y mpd mosquitto ffmpeg rsync
          sudo systemctl stop mpd mpd.socket || true
          sudo systemctl disable mpd mpd.socket || true
          sudo systemctl stop mosquitto || true
          sudo systemctl disable mosquitto || true

      - name: Box-Paket mit Testabhaengigkeiten installieren
        run: pip install -e "box[test]"

      - name: Tests ausfuehren
        run: pytest -q box/tests

  homeassistant:
    name: Home Assistant (pytest und jsdom)
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: homeassistant/requirements-test.txt

      - name: ffmpeg und Mosquitto installieren, Systemdienst aus
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mosquitto
          sudo systemctl stop mosquitto || true
          sudo systemctl disable mosquitto || true

      - name: Testabhaengigkeiten installieren
        run: pip install -r homeassistant/requirements-test.txt

      - name: Python-Tests ausfuehren
        run: pytest -q homeassistant/tests

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-jsdom-${{ github.run_id }}
          restore-keys: |
            npm-${{ runner.os }}-jsdom-

      - name: jsdom ausserhalb des Repos installieren
        run: npm install --prefix "$RUNNER_TEMP/jsdom" jsdom

      - name: Frontend-Tests ausfuehren
        run: node --test homeassistant/tests/frontend
        env:
          TOBIBOX_JSDOM_DIR: ${{ runner.temp }}/jsdom

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PlatformIO installieren
        run: pip install platformio==6.1.19

      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/tobibox-reader/platformio.ini') }}

      - name: Konfiguration mit Platzhalter anlegen
        run: cp firmware/tobibox-reader/include/config.example.h firmware/tobibox-reader/include/config.h

      - name: Native Tests ausfuehren
        run: pio test -e native
        working-directory: firmware/tobibox-reader

      - name: Firmware bauen (ohne Veroeffentlichung)
        run: pio run -e esp32s3
        working-directory: firmware/tobibox-reader
