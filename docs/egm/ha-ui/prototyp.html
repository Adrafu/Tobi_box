<title>Tobi Box Oberfläche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --text: #212121;
  --text2: #5f6368;
  --divider: #dcdfe3;
  --primary: #01689f;
  --on-primary: #ffffff;
  --primary-soft: #e1f2fb;
  --ok: #1b5e20;
  --ok-bg: #e6f4e7;
  --warn: #8a4b00;
  --warn-bg: #fff1d6;
  --danger: #b71c1c;
  --danger-bg: #fdeaea;
  --focus: #e65100;
  --shadow: rgba(0, 0, 0, 0.12);
  --scrim: rgba(0, 0, 0, 0.5);
  --shine: rgba(255, 255, 255, 0.2);
  --c1: #ad1457;
  --c2: #00695c;
  --c3: #5e35b1;
  --c4: #8d4a00;
  --c5: #1565c0;
  --c6: #2e7d32;
  --on-cover: #ffffff;
  --primary-ink: #01689f;
  --chart1: #01689f;
  --chart2: #a14a00;
  --grid: #c9cdd2;
  --pos: #1b5e20;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315;
    --card: #1c1e21;
    --text: #e8eaed;
    --text2: #aeb4bb;
    --divider: #3a3f45;
    --primary: #4fc3f7;
    --on-primary: #00212f;
    --primary-soft: #153446;
    --ok: #81c784;
    --ok-bg: #17301a;
    --warn: #ffcc80;
    --warn-bg: #3a2a0c;
    --danger: #ef9a9a;
    --danger-bg: #3a1717;
    --focus: #ffb74d;
    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.65);
    --shine: rgba(255, 255, 255, 0.12);
    --c1: #ad1457;
    --c2: #00695c;
    --c3: #5e35b1;
    --c4: #8d4a00;
    --c5: #1565c0;
    --c6: #2e7d32;
    --on-cover: #ffffff;
  --primary-ink: #4fc3f7;
  --chart1: #4fc3f7;
  --chart2: #ffb74d;
  --grid: #4a5057;
  --pos: #81c784;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315;
  --card: #1c1e21;
  --text: #e8eaed;
  --text2: #aeb4bb;
  --divider: #3a3f45;
  --primary: #4fc3f7;
  --on-primary: #00212f;
  --primary-soft: #153446;
  --ok: #81c784;
  --ok-bg: #17301a;
  --warn: #ffcc80;
  --warn-bg: #3a2a0c;
  --danger: #ef9a9a;
  --danger-bg: #3a1717;
  --focus: #ffb74d;
  --shadow: rgba(0, 0, 0, 0.5);
  --scrim: rgba(0, 0, 0, 0.65);
  --shine: rgba(255, 255, 255, 0.12);
  --c1: #ad1457;
  --c2: #00695c;
  --c3: #5e35b1;
  --c4: #8d4a00;
  --c5: #1565c0;
  --c6: #2e7d32;
  --on-cover: #ffffff;
  --primary-ink: #4fc3f7;
  --chart1: #4fc3f7;
  --chart2: #ffb74d;
  --grid: #4a5057;
  --pos: #81c784;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Roboto, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px;
  max-width: 1180px;
  margin: 0 auto;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.page > * { min-width: 0; }
#main { flex: 1 0 auto; padding-bottom: 24px; outline: none; }

/* Vorschau-Hinweis */
.preview { background: var(--primary-soft); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
.preview summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.preview .ctl { display: grid; gap: 8px; padding: 4px 0 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.preview label { display: grid; gap: 4px; font-size: 13px; color: var(--text2); }
.preview select { min-height: 44px; border-radius: 8px; border: 1px solid var(--divider); background: var(--card); padding: 0 8px; }

/* Kopf und Reiter */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.top h1 { font-size: 24px; margin: 0; font-weight: 500; flex: 1; }
.top .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.top .tech { min-height: 44px; padding: 0 14px; border-radius: 22px; font-size: 15px; }
.top .tech svg { width: 20px; height: 20px; fill: currentColor; }
.top .tech[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); border-color: var(--primary); }
nav.tabs {
  order: 9; position: sticky; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--divider);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.kbd nav.tabs { display: none; }
nav.tabs .tr { display: flex; max-width: 1180px; margin: 0 auto; }
nav.tabs a {
  flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--text2); font-size: 12px; font-weight: 500; position: relative; padding: 4px 2px; border-radius: 8px;
}
nav.tabs a svg { width: 24px; height: 24px; fill: currentColor; }
nav.tabs a[aria-current="page"] { color: var(--primary-ink); }
nav.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 3px; background: var(--primary); border-radius: 0 0 3px 3px; }
nav.tabs .dot { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: var(--card); font-size: 12px; line-height: 18px; text-align: center; font-weight: 700; }
nav.tabs .vb { position: absolute; top: 4px; right: 4px; font-size: 12px; line-height: 1; padding: 2px 4px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
@media (min-width: 900px) {
  .top { order: 1; }
  nav.tabs { order: 2; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--divider); margin-bottom: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 0; }
  #main { order: 3; }
  nav.tabs .tr { max-width: none; margin: 0; }
  nav.tabs a { flex: 0 0 auto; flex-direction: row; gap: 8px; font-size: 15px; padding: 0 20px; min-height: 52px; }
  nav.tabs a[aria-current="page"]::before { top: auto; bottom: 0; left: 8px; right: 8px; height: 3px; border-radius: 3px 3px 0 0; }
  nav.tabs .dot { position: static; }
  nav.tabs .vb { position: static; margin-left: 2px; font-size: 12px; }
}

/* Karten und Knöpfe */
h2 { font-size: 20px; font-weight: 500; margin: 24px 0 12px; }
h3 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
.card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); padding: 16px; margin-bottom: 16px; min-width: 0; }
.muted { color: var(--text2); font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 24px;
  border: 1px solid var(--divider); background: var(--card); font-weight: 500; text-align: center; text-decoration: none; color: var(--text);
}
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.big { min-height: 64px; font-size: 17px; border-radius: 16px; flex-direction: column; gap: 4px; padding: 8px 12px; }
.btn.big svg { width: 26px; height: 26px; fill: currentColor; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--card); }
.btn.link { border: 0; background: none; color: var(--primary-ink); min-height: 44px; padding: 0 8px; border-radius: 8px; }
.btn.link.danger { color: var(--danger); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.grid2 { display: grid; gap: 0 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 > .btn { margin-bottom: 12px; }
.bigbtns { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
.badge { display: inline-block; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.blue { background: var(--primary-soft); color: var(--primary-ink); }
.note { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; background: var(--primary-soft); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--danger-bg); color: var(--danger); }
.note.okk { background: var(--ok-bg); color: var(--ok); }
.note .btns { margin-top: 8px; }

/* Cover */
.cover { background-size: cover; background-position: center; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; color: var(--on-cover); font-weight: 700; font-size: 44px; background-image: linear-gradient(135deg, var(--shine), transparent 60%); width: 100%; }
.c1 { background-color: var(--c1); } .c2 { background-color: var(--c2); } .c3 { background-color: var(--c3); }
.c4 { background-color: var(--c4); } .c5 { background-color: var(--c5); } .c6 { background-color: var(--c6); }
.cover.sm { width: 48px; font-size: 22px; border-radius: 10px; flex: none; }
.cover.md { width: 64px; font-size: 28px; flex: none; }
.cover.lg { width: 120px; font-size: 52px; flex: none; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; } }
.tile { content-visibility: auto; contain-intrinsic-size: auto 190px; border: 0; background: none; padding: 4px; text-align: left; display: grid; gap: 6px; align-content: start; border-radius: 14px; min-width: 0; }
.tile:hover { background: var(--primary-soft); }
.tile .tn { font-weight: 500; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.tile .tm { font-size: 13px; color: var(--text2); }
.tile .pos { position: relative; }
.tile .pos .badge { position: absolute; left: 6px; bottom: 6px; font-size: 12px; padding: 1px 8px; background: var(--warn-bg); }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.tiles.small .cover { font-size: 34px; }
.tile.action .cover { background-color: var(--primary); color: var(--on-primary); }

/* Status */
.status { display: flex; gap: 12px; align-items: center; }
.status .txt { min-width: 0; flex: 1; }
.status .sent { font-weight: 500; font-size: 17px; overflow-wrap: anywhere; }
.status .dotx { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; background: var(--ok); }
.status.off .dotx { background: var(--text2); }
.status.off .cover { opacity: 0.45; }
.ph { background: var(--primary-soft); border-radius: 12px; }
.skel { height: 84px; border-radius: 12px; background: var(--primary-soft); margin-bottom: 16px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

/* Listen */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--divider); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .num { width: 36px; height: 36px; border-radius: 18px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 500; flex: none; }
.rowbtn { width: 100%; border: 0; background: none; text-align: left; padding: 10px 0; display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--divider); border-radius: 0; }
.rowbtn:first-child { border-top: 0; }
.iconbtn { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--divider); background: var(--card); display: inline-grid; place-items: center; font-size: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; border: 0; background: none; color: var(--primary-ink); font-weight: 500; padding: 0 8px 0 0; }
.back svg { width: 24px; height: 24px; fill: currentColor; }
.search { width: 100%; min-height: 48px; border-radius: 24px; border: 1px solid var(--divider); background: var(--card); padding: 0 16px; margin-bottom: 12px; }

/* Fortschritt */
.steps { display: flex; gap: 6px; margin: 8px 0 4px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--divider); }
.steps span.done { background: var(--ok); }
.steps span.now { background: var(--primary); }
.bar { height: 8px; background: var(--divider); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--primary); transition: width 0.3s; }
.up { padding: 12px 0; border-top: 1px solid var(--divider); }
.up:first-child { border-top: 0; }
.drop { border: 2px dashed var(--divider); border-radius: 16px; padding: 20px; text-align: center; color: var(--text2); display: none; margin-bottom: 16px; }
@media (min-width: 900px) { .drop { display: block; } }

/* Wochenplan */
.week { display: grid; gap: 6px; margin: 12px 0; }
.wd { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; font-size: 14px; }
.track { position: relative; height: 22px; border-radius: 6px; background: var(--primary-soft); overflow: hidden; }
.seg { position: absolute; top: 0; bottom: 0; background: var(--primary); }
.seg.leiser { background: var(--text2); opacity: 0.75; }
.axis { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 12px; color: var(--text2); }
.axis div { display: flex; justify-content: space-between; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--primary); vertical-align: -2px; margin-right: 6px; }
.legend i.l { background: var(--text2); opacity: 0.75; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--divider); background: var(--card); font-weight: 500; padding: 0 10px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
.stepper .val { min-width: 130px; text-align: center; font-size: 20px; font-weight: 500; }
.seg2 { display: inline-flex; border: 1px solid var(--divider); border-radius: 24px; overflow: hidden; }
.seg2 button { min-height: 44px; padding: 0 20px; border: 0; background: var(--card); font-weight: 500; }
.seg2 button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.field { display: grid; gap: 4px; margin: 12px 0; }
.field label, .field .lbl { font-size: 14px; color: var(--text2); }
.field select, .field input[type="text"] { min-height: 48px; border-radius: 10px; border: 1px solid var(--divider); background: var(--card); padding: 0 12px; }
.field input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--primary); }
.timesel { display: flex; align-items: center; gap: 6px; }

/* Dialog und Blatt (natives dialog-Element) */
dialog.sheet { border: 0; padding: 0; background: var(--card); color: var(--text); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 20px; box-shadow: 0 8px 32px var(--shadow); }
dialog.sheet::backdrop { background: var(--scrim); }
.sheet-in { padding: 20px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet h2 { margin: 0 0 8px; }
.sheet .btns { margin-top: 16px; }
.sheet .apart { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--divider); }
@media (max-width: 699px) { dialog.sheet { margin: auto 0 0; max-width: none; border-radius: 20px 20px 0 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 2000; background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 12px; max-width: min(92vw, 520px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* Anlernen */
.wait { text-align: center; padding: 24px 8px; }
.ring { width: 120px; height: 120px; margin: 8px auto 16px; border-radius: 60px; border: 4px solid var(--primary); display: grid; place-items: center; animation: ring 1.6s ease-in-out infinite; }
.ring svg { width: 48px; height: 48px; fill: var(--primary); }
@keyframes ring { 50% { transform: scale(1.08); box-shadow: 0 0 0 12px var(--primary-soft); } }
.big-ok { width: 72px; height: 72px; border-radius: 36px; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; }
.big-ok svg { width: 40px; height: 40px; fill: currentColor; }

details.sec { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); margin-bottom: 12px; padding: 0 16px; }
details.sec summary { min-height: 56px; display: flex; align-items: center; font-weight: 500; cursor: pointer; }
details.sec .inner { padding: 0 0 16px; }
table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
table.kv td { padding: 6px 0; border-top: 1px solid var(--divider); vertical-align: top; }
table.kv td:first-child { color: var(--text2); width: 45%; padding-right: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Rev. 2: Bibliothek, Filter, Listen */
.chips.wrap { gap: 8px; }
.chip .n { font-weight: 400; opacity: 0.85; margin-left: 4px; }
.toolbar { display: grid; gap: 12px; margin-bottom: 12px; }
.toolbar .line { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.toolbar select { min-height: 44px; border-radius: 22px; border: 1px solid var(--divider); background: var(--card); padding: 0 14px; }
.count { font-size: 14px; color: var(--text2); margin: 4px 0 12px; }
.frow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--divider); content-visibility: auto; contain-intrinsic-size: auto 64px; }
.frow:first-child { border-top: 0; }
.frow .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.frow .btn { min-height: 44px; padding: 0 14px; flex: none; }
.frow .nm { font-weight: 500; }
mark { background: var(--primary-soft); color: var(--text); border-radius: 3px; padding: 0 1px; }
.vb2 { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); vertical-align: 2px; }
.vc2 { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); vertical-align: 2px; }
.stufe { border: 2px dashed var(--warn); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; background: var(--warn-bg); color: var(--warn); }
.stufe.c { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
.namefield { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.namefield input { flex: 1 1 200px; min-height: 48px; border-radius: 10px; border: 1px solid var(--divider); background: var(--card); padding: 0 12px; min-width: 0; }
.crop { position: relative; width: 100%; max-width: 280px; aspect-ratio: 1; margin: 8px auto; border-radius: 12px; overflow: hidden; background: var(--primary-soft); touch-action: none; cursor: grab; }
.crop canvas { width: 100%; height: 100%; display: block; }
.charts { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: 1 / -1; } }
svg.chart { width: 100%; height: auto; max-width: 440px; display: block; }
svg.chart text { fill: var(--text2); font-size: 12px; font-family: Roboto, system-ui, sans-serif; }
svg.chart text.v { fill: var(--text); }
svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--text2); stroke-width: 1; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
details.zahlen summary { min-height: 44px; display: flex; align-items: center; color: var(--primary-ink); cursor: pointer; }

  /* ---------- Bibliothek: Auswahl, Filter, Sortierung ---------- */
  function seriesFiltered(B, ohneTerm) {
    var term = ohneTerm ? '' : norm(B.term);
    var l = S.series.filter(function (s) {
      if (B.art !== 'alle' && s.art !== B.art) return false;
      if (B.ohne && serieHatTobie(s)) return false;
      if (B.neu && s.ago > 14) return false;
      if (B.pruefen && !s.pruefen) return false;
      if (term && norm(s.name).indexOf(term) < 0) return false;
      return true;
    });
    l.sort(B.sort === 'neu' ? function (a, c) { return a.ago - c.ago || a.name.localeCompare(c.name, 'de'); } : function (a, c) { return a.name.localeCompare(c.name, 'de'); });
    return l;
  }
  function folgenFiltered(B) {
    var term = norm(B.term), out = [];
    S.series.forEach(function (s) {
      if (B.art !== 'alle' && s.art !== B.art) return;
      if (B.neu && s.ago > 14) return;
      if (B.pruefen && !s.pruefen) return;
      s.folgen.forEach(function (f, i) {
        if (term && norm(f.t).indexOf(term) < 0 && !(norm(s.name).indexOf(term) >= 0)) return;
        if (B.ohne && !folgeOhneTobie(s, i)) return;
        out.push({ s: s, i: i, f: f });
      });
    });
    out.sort(B.sort === 'neu' ? function (a, c) { return a.s.ago - c.s.ago || a.i - c.i; } : function (a, c) { return a.f.t.localeCompare(c.f.t, 'de') || a.s.name.localeCompare(c.s.name, 'de'); });
    return out;
  }
  function artCount(a) { return S.series.filter(function (s) { return a === 'alle' || s.art === a; }).length; }

    var h = '<div class="toolbar"><div><label class="sr" for="' + pre + 'suche">Suchen</label><input class="search" id="' + pre + 'suche" type="search" placeholder="Suchen: Hörspiel, Lied, Folge, Tobie" value="' + esc(B.term) + '" data-fk="' + pre + 'suche" style="margin-bottom:0"></div>';
    h += '<div class="chips wrap" role="group" aria-label="Art">' + ['alle'].concat(ARTEN).map(function (a) {

      '<div class="chips wrap" role="group" aria-label="Filter"><button class="chip" data-act="' + pre + 'f" data-arg="ohne" aria-pressed="' + B.ohne + '" data-fk="' + pre + 'fo">Ohne Tobie</button><button class="chip" data-act="' + pre + 'f" data-arg="neu" aria-pressed="' + B.neu + '" data-fk="' + pre + 'fn">Neu</button><button class="chip" data-act="' + pre + 'f" data-arg="pruefen" aria-pressed="' + B.pruefen + '" data-fk="' + pre + 'fp">Bitte ansehen</button>' + (stufeA() ? '' : '<button class="chip" disabled title="Stufe B – Vorschau">★ Favoriten <span class="vb2">B</span></button>') + '</div>' +

  function folgeRow(x, term, pre) {

  function libBody(B, pre, pick) {
    var term = B.term.trim(), h = '', act = pick ? 'pickS' : 'oeffne';

    if (S.mode === 'leer' || !S.series.length) return h + '<div class="card">Noch nichts da. Tippe auf „Hinzufügen“.</div>';
    if (!l.length) return h + '<div class="card">Nichts gefunden. Nimm einen Filter weg oder wähle „Alles“.</div>';
    h += '<div class="tiles">' + l.slice(0, B.shown).map(function (s) { return tileFor(s, act); }).join('') + '</div>';
    if (l.length > B.shown) h += '<div class="btns" style="justify-content:center;margin-top:16px"><button class="btn" data-act="' + pre + 'mehr" data-fk="' + pre + 'mehr">Mehr zeigen (60 weitere)</button></div>';

      $('tb-weg').onclick = function () { closeLayer(); confirmDlg('Tobie vergessen?', 'Er spielt dann nichts mehr, bis du ihn wieder anlernst.', 'Vergessen', function () { S.tobies = S.tobies.filter(function (x) { return x.uid !== arg; }); render(); toast('Der Tobie wurde vergessen.'); }, true); };
    },
    x: function (t, arg) { toast(arg + ' (Vorschau)'); },
    eingangWeg: function () { confirmDlg('Aus dem Eingang entfernen?', 'Die Datei „buch.m4b“ wird gelöscht. Das kann nicht rückgängig gemacht werden.', 'Entfernen', function () { toast('In der Vorschau nicht ausgeführt.'); }, true); },
    korbLeer: function () { confirmDlg('Papierkorb leeren?', (2 + S.korb.length) + ' Einträge werden endgültig gelöscht. Das kann nicht rückgängig gemacht werden.', 'Endgültig löschen', function () { S.korb = []; render(); toast('Papierkorb geleert (Vorschau: nur die neuen Einträge).'); }, true); },
    ausrollen: function () { confirmDlg('Liste neu an die Boxen schicken?', 'Alle Boxen bekommen den Stand aus Home Assistant. Ein neuerer Stand auf einer Box geht dabei verloren.', 'Neu schicken', function () { toast('In der Vorschau nicht ausgeführt.'); }, true); },
    ghBox: function (t, arg) { S.gh.box = arg; render(); }, ghTage: function (t, arg) { S.gh.tage = +arg; render(); },
    bart: function (t, arg) { S.bib.art = arg; S.bib.shown = 60; render(); }, bansicht: function (t, arg) { S.bib.ansicht = arg; S.bib.shown = 60; render(); },
    bf: function (t, arg) { S.bib[arg] = !S.bib[arg]; S.bib.shown = 60; render(); },
    bmehr: function () { var old = S.bib.shown; S.bib.shown += 60; render(); var it = document.querySelectorAll('#libbody .tiles .tile, #libbody .frow .btn'); if (it[old]) it[old].focus(); }
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.closest('#layer')) return;
    var act = t.dataset.act, arg = t.dataset.arg;
    if (A[act]) A[act](t, arg);
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'bsuche') { S.bib.term = e.target.value; S.bib.shown = 60; render(); }
    if (id === 'sterm') { S.serieTerm = e.target.value; S.serieShown = 20; render(); }
    if (id === 'tsuche') { S.tobieTerm = e.target.value; render(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'bsort') { S.bib.sort = e.target.value; S.bib.shown = 60; render(); }
    if (e.target.id === 'gn-andere' && e.target.value) { S.gn.timer = +e.target.value; render(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.dataset.actForm === 'startSuche') { e.preventDefault(); S.bib.term = $('startsuche').value; S.bib.art = 'alle'; S.bib.ansicht = 'kacheln'; S.bib.shown = 60; if (location.hash === '#bibliothek') render(); else location.hash = '#bibliothek'; }
  });
  document.addEventListener('focusin', function (e) { if (window.innerWidth < 900 && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'file') document.documentElement.classList.add('kbd'); });
  document.addEventListener('focusout', function () { document.documentElement.classList.remove('kbd'); });

  /* ---------- Vorschau-Schalter ---------- */
  function applyTheme(v) {
    var r = document.documentElement;
    ['--primary', '--on-primary', '--primary-ink', '--primary-soft'].forEach(function (p) { r.style.removeProperty(p); });
    if (v === 'auto') r.removeAttribute('data-theme');
    else if (v === 'hellprimaer') {
      r.setAttribute('data-theme', 'light');
      var p = '#ffeb3b', ink = p, k = 0;
      r.style.setProperty('--primary', p);
      r.style.setProperty('--on-primary', contrast(p, '#ffffff') >= 4.5 ? '#ffffff' : '#000000');
      while (contrast(ink, '#fff8c5') < 4.6 && k < 1) { k += 0.05; ink = mixBlack(p, k); }
      r.style.setProperty('--primary-ink', ink);
      r.style.setProperty('--primary-soft', '#fff8c5');
    } else r.setAttribute('data-theme', v);
  }
  $('sel-rolle').addEventListener('change', function (e) { S.admin = e.target.value === 'admin'; if (!S.admin && route().v === 'technik') location.hash = '#start'; render(); });
  $('sel-theme').addEventListener('change', function (e) { applyTheme(e.target.value); });
  $('sel-zustand').addEventListener('change', function (e) { S.mode = e.target.value; render(); });
  $('sel-stufe').addEventListener('change', function (e) { S.stufe = e.target.value; if (stufeA() && location.hash === '#gehoert') location.hash = '#start'; render(); });
  S.boxes[0].folge = serie('lange-serie').folgen[3].t;
  if (!location.hash) { history.replaceState(null, '', '#start'); }
  render();
})();
</script>
