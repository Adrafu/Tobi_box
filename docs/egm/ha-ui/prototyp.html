<style>
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --text: #212121;
  --text2: #5f6368;
  --divider: #dcdfe3;
  --primary: #01689f;
  --on-primary: #ffffff;
  --primary-soft: #e1f2fb;
  --ok: #1b5e20;
  --ok-bg: #e6f4e7;
  --warn: #8a4b00;
  --warn-bg: #fff1d6;
  --danger: #b71c1c;
  --danger-bg: #fdeaea;
  --focus: #e65100;
  --shadow: rgba(0, 0, 0, 0.12);
  --scrim: rgba(0, 0, 0, 0.5);
  --shine: rgba(255, 255, 255, 0.2);
  --c1: #ad1457;
  --c2: #00695c;
  --c3: #5e35b1;
  --c4: #8d4a00;
  --c5: #1565c0;
  --c6: #2e7d32;
  --on-cover: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315;
    --card: #1c1e21;
    --text: #e8eaed;
    --text2: #aeb4bb;
    --divider: #3a3f45;
    --primary: #4fc3f7;
    --on-primary: #00212f;
    --primary-soft: #153446;
    --ok: #81c784;
    --ok-bg: #17301a;
    --warn: #ffcc80;
    --warn-bg: #3a2a0c;
    --danger: #ef9a9a;
    --danger-bg: #3a1717;
    --focus: #ffb74d;
    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.65);
    --shine: rgba(255, 255, 255, 0.12);
    --c1: #ad1457;
    --c2: #00695c;
    --c3: #5e35b1;
    --c4: #8d4a00;
    --c5: #1565c0;
    --c6: #2e7d32;
    --on-cover: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315;
  --card: #1c1e21;
  --text: #e8eaed;
  --text2: #aeb4bb;
  --divider: #3a3f45;
  --primary: #4fc3f7;
  --on-primary: #00212f;
  --primary-soft: #153446;
  --ok: #81c784;
  --ok-bg: #17301a;
  --warn: #ffcc80;
  --warn-bg: #3a2a0c;
  --danger: #ef9a9a;
  --danger-bg: #3a1717;
  --focus: #ffb74d;
  --shadow: rgba(0, 0, 0, 0.5);
  --scrim: rgba(0, 0, 0, 0.65);
  --shine: rgba(255, 255, 255, 0.12);
  --c1: #ad1457;
  --c2: #00695c;
  --c3: #5e35b1;
  --c4: #8d4a00;
  --c5: #1565c0;
  --c6: #2e7d32;
  --on-cover: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Roboto, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
  max-width: 1180px;
  margin: 0 auto;
  min-width: 0;
}

/* Vorschau-Hinweis */
.preview { background: var(--primary-soft); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
.preview summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.preview .ctl { display: grid; gap: 8px; padding: 4px 0 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.preview label { display: grid; gap: 4px; font-size: 13px; color: var(--text2); }
.preview select { min-height: 44px; border-radius: 8px; border: 1px solid var(--divider); background: var(--card); padding: 0 8px; }

/* Kopf und Reiter */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.top h1 { font-size: 24px; margin: 0; font-weight: 500; }
.top .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--divider);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .tr { display: flex; max-width: 1180px; margin: 0 auto; }
nav.tabs a {
  flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--text2); font-size: 12px; font-weight: 500; position: relative; padding: 4px 2px; border-radius: 8px;
}
nav.tabs a svg { width: 24px; height: 24px; fill: currentColor; }
nav.tabs a[aria-current="page"] { color: var(--primary); }
nav.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 3px; background: var(--primary); border-radius: 0 0 3px 3px; }
nav.tabs .dot { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: var(--card); font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
@media (min-width: 900px) {
  .page { padding-bottom: 32px; }
  nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--divider); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 0; }
  nav.tabs .tr { max-width: none; margin: 0; }
  nav.tabs a { flex: 0 0 auto; flex-direction: row; gap: 8px; font-size: 15px; padding: 0 20px; min-height: 52px; }
  nav.tabs a[aria-current="page"]::before { top: auto; bottom: 0; left: 8px; right: 8px; height: 3px; border-radius: 3px 3px 0 0; }
  nav.tabs .dot { position: static; }
}

/* Karten und Knöpfe */
h2 { font-size: 20px; font-weight: 500; margin: 24px 0 12px; }
h3 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
.card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); padding: 16px; margin-bottom: 16px; min-width: 0; }
.muted { color: var(--text2); font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 24px;
  border: 1px solid var(--divider); background: var(--card); font-weight: 500; text-align: center; text-decoration: none; color: var(--text);
}
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.big { min-height: 64px; font-size: 17px; border-radius: 16px; flex-direction: column; gap: 4px; padding: 8px 12px; }
.btn.big svg { width: 26px; height: 26px; fill: currentColor; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--card); }
.btn.link { border: 0; background: none; color: var(--primary); min-height: 44px; padding: 0 8px; border-radius: 8px; }
.btn.link.danger { color: var(--danger); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.grid2 { display: grid; gap: 0 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 > .btn { margin-bottom: 12px; }
.bigbtns { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
.badge { display: inline-block; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.blue { background: var(--primary-soft); color: var(--primary); }
.note { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; background: var(--primary-soft); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--danger-bg); color: var(--danger); }
.note.okk { background: var(--ok-bg); color: var(--ok); }
.note .btns { margin-top: 8px; }

/* Cover */
.cover { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; color: var(--on-cover); font-weight: 700; font-size: 44px; background-image: linear-gradient(135deg, var(--shine), transparent 60%); width: 100%; }
.c1 { background-color: var(--c1); } .c2 { background-color: var(--c2); } .c3 { background-color: var(--c3); }
.c4 { background-color: var(--c4); } .c5 { background-color: var(--c5); } .c6 { background-color: var(--c6); }
.cover.sm { width: 48px; font-size: 22px; border-radius: 10px; flex: none; }
.cover.md { width: 64px; font-size: 28px; flex: none; }
.cover.lg { width: 120px; font-size: 52px; flex: none; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; } }
.tile { border: 0; background: none; padding: 4px; text-align: left; display: grid; gap: 6px; align-content: start; border-radius: 14px; min-width: 0; }
.tile:hover { background: var(--primary-soft); }
.tile .tn { font-weight: 500; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.tile .tm { font-size: 13px; color: var(--text2); }
.tile .pos { position: relative; }
.tile .pos .badge { position: absolute; left: 6px; top: 6px; font-size: 12px; padding: 1px 8px; background: var(--warn-bg); }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.tiles.small .cover { font-size: 34px; }
.tile.action .cover { background-color: var(--primary); color: var(--on-primary); }

/* Status */
.status { display: flex; gap: 12px; align-items: center; }
.status .txt { min-width: 0; flex: 1; }
.status .sent { font-weight: 500; font-size: 17px; overflow-wrap: anywhere; }
.status .dotx { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; background: var(--ok); }
.status.off .dotx { background: var(--text2); }
.status.off .cover { opacity: 0.45; }
.ph { background: var(--primary-soft); border-radius: 12px; }
.skel { height: 84px; border-radius: 12px; background: var(--primary-soft); margin-bottom: 16px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

/* Listen */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--divider); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .num { width: 36px; height: 36px; border-radius: 18px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 500; flex: none; }
.rowbtn { width: 100%; border: 0; background: none; text-align: left; padding: 10px 0; display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--divider); border-radius: 0; }
.rowbtn:first-child { border-top: 0; }
.iconbtn { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--divider); background: var(--card); display: inline-grid; place-items: center; font-size: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; border: 0; background: none; color: var(--primary); font-weight: 500; padding: 0 8px 0 0; }
.back svg { width: 24px; height: 24px; fill: currentColor; }
.search { width: 100%; min-height: 48px; border-radius: 24px; border: 1px solid var(--divider); background: var(--card); padding: 0 16px; margin-bottom: 12px; }

/* Fortschritt */
.steps { display: flex; gap: 6px; margin: 8px 0 4px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--divider); }
.steps span.done { background: var(--ok); }
.steps span.now { background: var(--primary); }
.bar { height: 8px; background: var(--divider); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--primary); transition: width 0.3s; }
.up { padding: 12px 0; border-top: 1px solid var(--divider); }
.up:first-child { border-top: 0; }
.drop { border: 2px dashed var(--divider); border-radius: 16px; padding: 20px; text-align: center; color: var(--text2); display: none; margin-bottom: 16px; }
@media (min-width: 900px) { .drop { display: block; } }

/* Wochenplan */
.week { display: grid; gap: 6px; margin: 12px 0; }
.wd { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; font-size: 14px; }
.track { position: relative; height: 22px; border-radius: 6px; background: var(--primary-soft); overflow: hidden; }
.seg { position: absolute; top: 0; bottom: 0; background: var(--primary); }
.seg.leiser { background: var(--text2); opacity: 0.75; }
.axis { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 12px; color: var(--text2); }
.axis div { display: flex; justify-content: space-between; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--primary); vertical-align: -2px; margin-right: 6px; }
.legend i.l { background: var(--text2); opacity: 0.75; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--divider); background: var(--card); font-weight: 500; padding: 0 10px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
.stepper .val { min-width: 130px; text-align: center; font-size: 20px; font-weight: 500; }
.seg2 { display: inline-flex; border: 1px solid var(--divider); border-radius: 24px; overflow: hidden; }
.seg2 button { min-height: 44px; padding: 0 20px; border: 0; background: var(--card); font-weight: 500; }
.seg2 button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.field { display: grid; gap: 4px; margin: 12px 0; }
.field label, .field .lbl { font-size: 14px; color: var(--text2); }
.field select, .field input[type="text"] { min-height: 48px; border-radius: 10px; border: 1px solid var(--divider); background: var(--card); padding: 0 12px; }
.field input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--primary); }
.timesel { display: flex; align-items: center; gap: 6px; }

/* Dialog und Blatt */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet h2 { margin: 0 0 8px; }
.sheet .btns { margin-top: 16px; }
.sheet .apart { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--divider); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 12px; max-width: min(92vw, 520px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* Anlernen */
.wait { text-align: center; padding: 24px 8px; }
.ring { width: 120px; height: 120px; margin: 8px auto 16px; border-radius: 60px; border: 4px solid var(--primary); display: grid; place-items: center; animation: ring 1.6s ease-in-out infinite; }
.ring svg { width: 48px; height: 48px; fill: var(--primary); }
@keyframes ring { 50% { transform: scale(1.08); box-shadow: 0 0 0 12px var(--primary-soft); } }
.big-ok { width: 72px; height: 72px; border-radius: 36px; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; }
.big-ok svg { width: 40px; height: 40px; fill: currentColor; }

details.sec { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); margin-bottom: 12px; padding: 0 16px; }
details.sec summary { min-height: 56px; display: flex; align-items: center; font-weight: 500; cursor: pointer; }
details.sec .inner { padding: 0 0 16px; }
table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
table.kv td { padding: 6px 0; border-top: 1px solid var(--divider); vertical-align: top; }
table.kv td:first-child { color: var(--text2); width: 45%; padding-right: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

      neuWahl: function () {
        var uid = t.closest('[data-uid]').dataset.uid, n = S.neu.filter(function (x) { return x.uid === uid; })[0];
        n.done = arg; S.tobies.unshift({ uid: uid, name: '', ziel: arg, neu: true }); document.getElementById('live').textContent = 'Fertig. Dieser Tobie spielt jetzt ' + zielName(arg); render();
      },
      neuUndo: function () { var n = S.neu.filter(function (x) { return x.uid === arg; })[0]; n.done = null; S.tobies = S.tobies.filter(function (x) { return x.uid !== arg; }); render(); },
      neuOk: function () { S.neu = S.neu.filter(function (x) { return x.uid !== arg; }); render(); toast('Der Tobie steht jetzt unter „Tobies“.'); document.getElementById('main').focus(); },
      neuName: function () { textSheet('Namen für den Tobie', 'Name (zum Beispiel die Farbe oder das Tier)', '', function (v) { S.tobies.filter(function (x) { return x.uid === arg; })[0].name = v; toast('Name gespeichert.'); render(); }); },
      neuWeg: function () { confirmDlg('Nicht merken?', 'Dieser Tobie spielt dann weiter die Überraschung. Legst du ihn noch einmal auf, taucht er wieder hier auf.', 'Nicht merken', function () { S.neu = S.neu.filter(function (x) { return x.uid !== arg; }); render(); }, false); },
      demoNeu: function () { if (!S.neu.length) { S.neu.push({ uid: '04' + Math.random().toString(16).slice(2, 14).toUpperCase(), box: 'mond', ago: 'gerade eben', done: null }); } render(); toast('Ein neuer Tobie wurde gemeldet.'); },
      serieName: function () { var s = serie(arg); textSheet('Hörspiel umbenennen', 'Name', s.name, function (v) { s.name = v; toast('Gespeichert.'); render(); }); },
      geprueft: function () { serie(arg).pruefen = null; toast('Danke, ist erledigt.'); render(); },
      folgeName: function () { var p = arg.split('|'), s = serie(p[0]), f = s.ordnerFolgen[+p[1]]; textSheet('Folge umbenennen', 'Name', f[0], function (v) { f[0] = v; toast('Gespeichert.'); render(); }); },
      reihe: function () { S.reihenfolge = !S.reihenfolge; render(); },
      hoch: function () { var p = arg.split('|'), a = serie(p[0]).ordnerFolgen, i = +p[1]; if (i > 0) { var x = a[i]; a[i] = a[i - 1]; a[i - 1] = x; } render(); var el = document.querySelector('[data-fk="up' + (i - 1) + '"]'); if (el && !el.disabled) el.focus(); },
      runter: function () { var p = arg.split('|'), a = serie(p[0]).ordnerFolgen, i = +p[1]; if (i < a.length - 1) { var x = a[i]; a[i] = a[i + 1]; a[i + 1] = x; } render(); var el = document.querySelector('[data-fk="dn' + (i + 1) + '"]'); if (el && !el.disabled) el.focus(); },
      serieWeg: function () { var s = serie(arg); var tc = S.tobies.filter(function (x) { return x.ziel === arg; }).length; confirmDlg('„' + s.name + '“ in den Papierkorb?', 'Das Hörspiel verschwindet aus der Liste.' + (tc ? ' ' + tc + (tc === 1 ? ' Tobie spielt' : ' Tobies spielen') + ' dann nichts mehr.' : '') + ' Tobias kann es aus dem Papierkorb zurückholen.', 'In den Papierkorb', function () { S.series = S.series.filter(function (x) { return x.id !== arg; }); S.tobies = S.tobies.filter(function (x) { return x.ziel !== arg; }); location.hash = '#hoerspiele'; toast('„' + s.name + '“ ist im Papierkorb.'); }, true); },
      zusammen: function () { pickSerieSheet('Mit welchem Hörspiel zusammenführen?', function (id) { if (id === arg) { toast('Bitte ein anderes Hörspiel wählen.'); return; } toast('In der Vorschau nicht ausgeführt.'); }); },
      lern: function () {
        var p = arg.split('|'); S.lern = { serie: p[0], box: p[1], state: 'wartet', rest: 120 };
        S.lern.timer = setInterval(function () { if (!S.lern || S.lern.state !== 'wartet') { clearInterval(S.lern && S.lern.timer); return; } S.lern.rest -= 1; if (S.lern.rest <= 0) { S.lern.state = 'abgelaufen'; } if (route().v === 'anlernen') { if (S.lern.state !== 'wartet') render(); else { var r = document.getElementById('rest'); if (r) r.textContent = S.lern.rest; } } }, 1000);
        location.hash = '#anlernen';
      },
      lernAbbruch: function () { var s = S.lern.serie; clearInterval(S.lern.timer); S.lern = null; location.hash = '#serie-' + s; toast('Abgebrochen.'); },
      lernErkannt: function () { clearInterval(S.lern.timer); S.lern.state = 'fertig'; S.tobies.unshift({ uid: '04' + Math.random().toString(16).slice(2, 14).toUpperCase(), name: '', ziel: S.lern.serie }); document.getElementById('live').textContent = 'Erkannt. Dieser Tobie spielt jetzt ' + serie(S.lern.serie).name; render(); },
      lernBelegt: function () {
        var s = serie(S.lern.serie);
        openSheet('Dieser Tobie spielt schon etwas', '<p>Er spielt jetzt „Test-Serie“. Soll er stattdessen „' + esc(s.name) + '“ spielen?</p><p class="muted">Du hast dafür noch 10 Sekunden.</p>', [{ label: 'Nein, so lassen', fn: function () { clearInterval(S.lern.timer); var sid = S.lern.serie; S.lern = null; location.hash = '#serie-' + sid; toast('Nichts geändert.'); } }, { label: 'Ja, ändern', kind: 'primary', fn: function () { A.lernErkannt(); } }], 'alertdialog');
      },
      lernNoch: function () { clearInterval(S.lern.timer); arg = S.lern.serie + '|' + S.lern.box; A.lern(); },
      addHandy: function () {
        openSheet('Gehören die Dateien zu einem Hörbuch?', '<p>Du hast 2 Dateien gewählt (Vorschau). Wenn es Kapitel eines Hörbuchs sind, kommen sie zusammen in eine Folge.</p>', [{ label: 'Nein, einzelne Folgen', fn: function () { demoHandy(false); } }, { label: 'Ja, ein Hörbuch', kind: 'primary', fn: function () { demoHandy(true); } }]);
      },
      addOrdner: function () { demoOrdner(); },
      upOk: function () { S.uploads.forEach(function (u) { if (String(u.id) === arg) u.ok = true; }); render(); toast('Danke, ist erledigt.'); },
      gnHilfe: function () { openSheet('Gute-Nacht-Tobie anlegen', '<ol style="padding-left:20px"><li>Nimm einen Tobie, der noch nichts spielt.</li><li>Lege ihn auf eine Box.</li><li>Auf der Startseite erscheint „Neuer Tobie“.</li><li>Wähle dort die Kachel „Gute Nacht“.</li></ol>', [{ label: 'Verstanden', kind: 'primary' }]); },
      tMinus: function () { S.gn.timer = Math.max(5, S.gn.timer - 5); render(); }, tPlus: function () { S.gn.timer = Math.min(240, S.gn.timer + 5); render(); },
      aMinus: function () { S.gn.aus = Math.max(15, S.gn.aus - 15); render(); }, aPlus: function () { S.gn.aus = Math.min(600, S.gn.aus + 15); render(); },
      gnSave: function () { S.gn.savedTimer = S.gn.timer; S.gn.savedAus = S.gn.aus; render(); toast('Gespeichert. Die Boxen bekommen es gleich.'); },
      winEdit: function () { winSheet(arg); }, winNeu: function () { winSheet(null); },
      tobie: function () {
        var tb = S.tobies.filter(function (x) { return x.uid === arg; })[0];
        openSheet(tb.name || 'Tobie ohne Namen', '<p>Spielt: <strong>„' + esc(zielName(tb.ziel)) + '“</strong></p><div class="btns"><button class="btn" id="tb-name">Namen ändern</button><button class="btn primary" id="tb-ziel">Anderes Hörspiel</button></div><div class="apart"><button class="btn link danger" id="tb-weg">Diesen Tobie vergessen …</button></div>', [{ label: 'Schließen' }]);
        document.getElementById('tb-name').onclick = function () { closeLayer(); textSheet('Namen für den Tobie', 'Name', tb.name, function (v) { tb.name = v; toast('Name gespeichert.'); render(); }); };
        document.getElementById('tb-ziel').onclick = function () { closeLayer(); pickSerieSheet('Was soll dieser Tobie spielen?', function (id) { var alt = tb.ziel; tb.ziel = id; render(); toast('Fertig: spielt jetzt „' + serie(id).name + '“.'); }); };
        document.getElementById('tb-weg').onclick = function () { closeLayer(); confirmDlg('Tobie vergessen?', 'Er spielt dann nichts mehr, bis du ihn wieder anlernst.', 'Vergessen', function () { S.tobies = S.tobies.filter(function (x) { return x.uid !== arg; }); render(); toast('Der Tobie wurde vergessen.'); }, true); };
      },
      x: function () { toast(arg + ' (Vorschau)'); },
      eingangWeg: function () { confirmDlg('Aus dem Eingang entfernen?', 'Die Datei „buch.m4b“ wird gelöscht. Das kann nicht rückgängig gemacht werden.', 'Entfernen', function () { toast('In der Vorschau nicht ausgeführt.'); }, true); },
      korbLeer: function () { confirmDlg('Papierkorb leeren?', '2 Einträge werden endgültig gelöscht. Das kann nicht rückgängig gemacht werden.', 'Endgültig löschen', function () { toast('In der Vorschau nicht ausgeführt.'); }, true); },
      ausrollen: function () { confirmDlg('Liste neu an die Boxen schicken?', 'Alle Boxen bekommen den Stand aus Home Assistant. Ein neuerer Stand auf einer Box geht dabei verloren.', 'Neu schicken', function () { toast('In der Vorschau nicht ausgeführt.'); }, true); }
    };
    if (A[act]) A[act]();
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'suche') { S.searchTerm = e.target.value; render(); } });

  /* ---------- Vorschau-Schalter ---------- */
  document.getElementById('sel-rolle').addEventListener('change', function (e) { S.admin = e.target.value === 'admin'; if (!S.admin && route().v === 'tobias') location.hash = '#start'; render(); });
  document.getElementById('sel-theme').addEventListener('change', function (e) { var v = e.target.value; if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); });
  document.getElementById('sel-zustand').addEventListener('change', function (e) {
    S.mode = e.target.value; render();
  });
  if (!location.hash) { history.replaceState(null, '', '#start'); }
  render();
})();
</script>
