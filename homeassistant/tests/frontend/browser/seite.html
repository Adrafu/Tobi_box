<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfseite</title>
<style>
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }
  body.mitha { display: flex; }
  body.mitha #root { flex: 1 1 0; min-width: 0; }
  #hasidebar { flex: none; height: 100%; box-sizing: border-box; border-right: 1px solid var(--divider-color); background: var(--card-background-color); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
/* Prüfseite für pruefe_seite.py: die App in einem Shadow-Root (wie im HA-Panel), Theme-Farben als HA-Variablen.
 * Parameter: theme=hell|dunkel|gelb, k=<Profil>[~<Lauf>], pw=<Panelbreite in px, leer = volle Breite>, narrow=1. */
const q = new URLSearchParams(location.search);
const THEMES = {
  hell: ['#fafafa', '#ffffff', '#212121', '#727272', '#e0e0e0', '#03a9f4', '#ffffff'],
  dunkel: ['#111111', '#1c1c1c', '#e1e1e1', '#9b9b9b', '#383838', '#ff9800', '#000000'],
  gelb: ['#ffffff', '#ffffff', '#212121', '#727272', '#e0e0e0', '#ffeb3b', '#ffffff'],
};
const T = THEMES[q.get('theme') || 'hell'];
['--primary-background-color', '--card-background-color', '--primary-text-color', '--secondary-text-color', '--divider-color', '--primary-color', '--text-primary-color']
  .forEach((n, i) => document.documentElement.style.setProperty(n, T[i]));
document.body.style.background = T[0];
const k = q.get('k') || 'admin';
const root = document.getElementById('root');
/* Parameter hs=<px>: die Seitenleiste von Home Assistant links daneben (echt 256 px); das Panel ist dann Fenster minus hs. */
if (q.get('hs')) {
  document.body.classList.add('mitha');
  const sb = document.createElement('div');
  sb.id = 'hasidebar';
  sb.style.width = `${Number(q.get('hs'))}px`;
  document.body.insertBefore(sb, root);
}
/* Wie Home Assistant: Klicks auf Links mit `#…` werden abgefangen (auch aus dem Shadow-DOM, über composedPath), die Adresse
 * setzt `history.pushState`, danach meldet das Fenster `location-changed`. Ein `hashchange` kommt dabei NICHT (Befund B1).
 * Mit `ha=0` aus: dann springt der Browser selbst zum Anker. */
if (q.get('ha') !== '0') {
  window.addEventListener('click', (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.composedPath().find((n) => n instanceof HTMLAnchorElement);
    const href = a && a.getAttribute('href');
    if (!href || !href.startsWith('#')) return;
    e.preventDefault();
    history.pushState(null, '', `${location.pathname}${location.search}${href}`);
    window.dispatchEvent(new CustomEvent('location-changed'));
  });
}
if (q.get('pw')) root.style.width = `${Number(q.get('pw'))}px`;
await import('/f/tobibox-app.js');
const wurzel = root.attachShadow({ mode: 'open' });
const el = document.createElement('tobibox-app');
// Höhe: wie in HA allein aus dem Element (100dvh minus Rand des Panel-Behälters)
const ws = async (m) => {
  const r = await (await fetch(`/ws?k=${encodeURIComponent(k)}`, { method: 'POST', body: JSON.stringify(m) })).json();
  if (r.error) throw r.error;
  return r.ok;
};
/* Abo: die Ereignisse des Mocks werden alle 120 ms beim Server abgeholt (`/ev`, ab dem Stand beim Abonnieren), damit Abläufe wie „Tobie
 * auflegen“ (`/legeauf`) die Seite erreichen. */
const abo = async (cb) => {
  let n = (await (await fetch(`/ev?k=${encodeURIComponent(k)}&ab=-1`)).json()).n;
  let aktiv = true;
  (async () => {
    while (aktiv) {
      try { const r = await (await fetch(`/ev?k=${encodeURIComponent(k)}&ab=${n}`)).json(); n = r.n; r.ereignisse.forEach((e) => aktiv && cb(e)); } catch { /* die Prüfung läuft weiter */ }
      await new Promise((x) => setTimeout(x, 120));
    }
  })();
  return () => { aktiv = false; };
};
el.hass = { user: { is_admin: !k.startsWith('user') }, connection: { sendMessagePromise: ws, subscribeMessage: abo }, fetchWithAuth: (p) => fetch(p) };
el.narrow = q.get('narrow') === '1';
/* Wie ha-panel-custom: Light-DOM-Behälter ohne eigene Höhe (display:block, height:auto), mit Innenabstand für die
 * Safe-Area (sa=<px unten>, sao=<px oben>; HA setzt padding-top/-bottom auf den Behälter). Emulierte Safe-Area der
 * Seite selbst (ohne HA-Abstand): si=<px> als --tb-safe-unten. */
const ha = document.createElement('div');
ha.id = 'hapanel';
ha.style.cssText = 'display:block;box-sizing:border-box;background:var(--primary-background-color)';
if (q.get('sa')) ha.style.paddingBottom = `${Number(q.get('sa'))}px`;
if (q.get('sao')) ha.style.paddingTop = `${Number(q.get('sao'))}px`;
if (q.get('si')) document.documentElement.style.setProperty('--tb-safe-unten', `${Number(q.get('si'))}px`);
wurzel.appendChild(ha);
ha.appendChild(el);
window.__el = el;
</script>
<script src="/messen.js"></script>
</body>
</html>
