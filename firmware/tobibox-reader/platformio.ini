; Tobi Box – Firmware tobibox-reader (ESP32-S3 + PN5180)
; Bauen: cp include/config.example.h include/config.h, dann `pio run -e esp32s3`.
; Tests auf dem Rechner: `pio test -e native` (braucht keine config.h).

[platformio]
default_envs = esp32s3

[env:esp32s3]
; pioarduino, feste Release-Version (enthaelt Arduino-Core 3.3.x, siehe README).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
; ESP32-S3 SuperMini: 4 MB Flash. Das devkitc-1-Board ist die nahste Vorlage;
; Flash-Groesse und Partitionstabelle werden unten fuer 4 MB gesetzt (sonst Bootloop).
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
monitor_speed = 115200
; Die letzte Zeile von build_flags liefert den Git-Hash fuer HELLO build= (ohne Git: unknown).
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    !python3 -c "import subprocess as s;r=lambda *a:s.run(a,capture_output=True,text=True).stdout.strip();h=r('git','rev-parse','--short=12','HEAD');v=(h+('-dirty' if r('git','status','--porcelain','--','.') else '')) if h else 'unknown';q=chr(92)+chr(34);print('-DBUILD_GIT='+q+v+q)"
build_src_flags = -Wall -Wextra
; PN5180-Bibliothek (tueddy), per Commit festgelegt (Version 2.2.0 laut library.properties).
lib_deps =
    https://github.com/tueddy/PN5180-Library.git#69ec032289457b1adae3e1b269ca22ea16aa46fd
lib_ldf_mode = chain

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Iinclude
; Nur die Logik ohne Arduino-Typen.
build_src_filter =
    -<*>
    +<debounce.cpp>
    +<protocol.cpp>
test_build_src = yes
; Unity fest gepinnt (sonst holt pio "^2.6.1").
lib_deps = throwtheswitch/Unity@2.6.1
