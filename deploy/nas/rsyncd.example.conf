# Vorlage: rsync-Daemon auf dem QNAP (AP 3.5)
#
# Achtung: QTS erzeugt seine rsync-Konfiguration selbst. Diese Datei ist die
# Vorlage für die Werte, die Tobias in der QNAP-Oberfläche einträgt (Rsync-Server,
# siehe docs/betrieb/tailscale-nas.md, Abschnitt 4). Sie wird nicht direkt auf
# das QNAP kopiert. Bitte am Gerät prüfen, welche Felder QTS wirklich anbietet.
#
# Platzhalter in <...> vor dem Einsatz ersetzen. Passwörter stehen nie hier,
# sondern in der QNAP-Oberfläche bzw. auf der Box.

uid = nobody
gid = nogroup
use chroot = yes
max connections = 2
transfer logging = yes
dont compress = *.mp3 *.flac *.ogg *.m4a *.opus *.zip

# Medien: Die Boxen lesen nur. HA schreibt über die SMB-Freigabe, nicht über rsync.
# Reservierte Ordner (Vertrag W, Abschnitt 11.1 und 12): _upload/, _papierkorb/
# und alle Ordner, die mit _ beginnen, sowie eingang (ohne Rücksicht auf Groß-
# und Kleinschreibung) gehören nie zur Box. Der Eingang tobibox/eingang/ liegt
# neben medien/ und ist ohnehin nicht im Modul; die Ausnahme ist nur für den Fall,
# dass jemand einen solchen Ordner doch in medien/ anlegt.
[medien]
    path = /share/<NAS-Freigabe>/tobibox/medien
    comment = Tobi Box Medien (nur lesend)
    read only = yes
    list = yes
    auth users = tobibox-box1,tobibox-box2
    secrets file = /etc/rsyncd.secrets
    hosts allow = 100.64.0.0/10
    hosts deny = *
    exclude = _upload/ _papierkorb/ _*/ [Ee][Ii][Nn][Gg][Aa][Nn][Gg]/

# Update-Pakete: Die Boxen lesen nur. Schreiben darf nur HA (SMB), Tobias legt Pakete ab.
[releases]
    path = /share/<NAS-Freigabe>/tobibox/releases
    comment = Tobi Box Update-Pakete (nur lesend)
    read only = yes
    list = yes
    auth users = tobibox-box1,tobibox-box2
    secrets file = /etc/rsyncd.secrets
    hosts allow = 100.64.0.0/10
    hosts deny = *
